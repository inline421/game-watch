name: wxdaily
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wxdaily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: build weather board
        run: python3 wxdaily.py
      - name: commit
        run: |
          git config user.name watch-bot
          git config user.email watch-bot@users.noreply.github.com
          git add wx_latest.json venue_geo.json
          git diff --cached --quiet || (git commit -qm 'wx board' && git pull --rebase -q && git push -q)
