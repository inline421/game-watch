name: game-watch
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      live_seconds:
        description: 'loop seconds (test)'
        required: false
        default: ''
permissions:
  contents: write
  issues: write
concurrency:
  group: game-watch
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: watch
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: sharpsheet-608c226b9e7a
          LIVE_SECONDS: ${{ github.event.inputs.live_seconds || '20400' }}
        run: python3 watch.py
